<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>こうがん踏み脱出ゲーム</title>
<meta name="description" content="こうがん以外を踏むとスタートからやり直し。5×5のマスを抜けて脱出しよう！">

<style>
:root{
  --bg:#120c10; --fg:#ffe6f2; --sub:#c98fb0;
  --tile:#1e1418; --line:#4a2c3c; --me:#ff4fa3; --goal:#ff8fc4; --bad:#3a1620;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120c10; --fg:#ffe6f2; --sub:#c98fb0;
  --tile:#1e1418; --line:#4a2c3c; --me:#ff4fa3; --goal:#ff8fc4; --bad:#3a1620;
}}
:root[data-theme="dark"]{
  --bg:#120c10; --fg:#ffe6f2; --sub:#c98fb0;
  --tile:#1e1418; --line:#4a2c3c; --me:#ff4fa3; --goal:#ff8fc4; --bad:#3a1620;
}
:root.celebrate{
  --bg:#ffffff; --fg:#3a1428; --sub:#b5507c;
  --tile:#ffffff; --line:#ffd6ea; --me:#ff4fa3; --goal:#5be6ff; --bad:#ffe3ea;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  padding:10px 16px 12px;max-width:520px;margin:0 auto;position:relative;
  transition:background .6s ease,color .6s ease}
h1{font-size:1.25rem;margin:0 0 2px;
  text-shadow:0 1px 0 #d6358a,0 2px 0 #b5256f,0 4px 5px rgba(0,0,0,.65);
  letter-spacing:.06em;color:#ffd3ea;font-weight:800;
  font-family:"Kaisei Decol","Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif}
.rule{background:var(--tile);border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;margin:6px 0;font-size:.78rem;line-height:1.4}
.rule b{color:var(--me)}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;container-type:inline-size;width:calc(100% - 4px);margin:0 auto}
.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  background:var(--tile);border:2px solid var(--line);border-radius:10px;
  transition:background .6s ease,border-color .6s ease;
  font-size:7cqw;font-weight:600;cursor:pointer;user-select:none;overflow:hidden;
  white-space:nowrap}
.c.near{border-color:var(--me)}
.c.me{background:radial-gradient(ellipse 60% 38% at 32% 20%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%),linear-gradient(160deg,rgba(255,120,190,.85),rgba(255,79,163,.7) 60%,rgba(220,50,140,.8));backdrop-filter:blur(1px);border-width:1.5px;border-color:rgba(255,79,163,.75);
  box-shadow:0 0 6px 1px rgba(255,79,163,.55);
  padding:0;overflow:hidden;position:relative;z-index:2;
  animation:mePulse 1.3s ease-in-out infinite;transform-origin:center}
.c.me img.footimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  pointer-events:none;
  -webkit-mask-image:radial-gradient(circle at 50% 46%,#000 58%,transparent 94%);
  mask-image:radial-gradient(circle at 50% 46%,#000 58%,transparent 94%)}
.c.me .footemoji{font-size:14cqw;line-height:1;filter:drop-shadow(0 0 6px rgba(255,79,163,.7))}
@keyframes mePulse{
 0%,100%{transform:scale(.9);box-shadow:0 0 5px 1px rgba(255,79,163,.45);}
 50%{transform:scale(1.06);box-shadow:0 0 9px 2px rgba(255,79,163,.6);}
}
.c.goal{background:#5be6ff;color:#0a1a1f;border-color:#5be6ff;font-weight:800;
  box-shadow:0 0 16px 3px #5be6ffcc;font-size:6cqw;letter-spacing:.05em;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif}
.c.kougan{font-size:4cqw;font-weight:800;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif}
.c.small{font-size:5cqw;line-height:1.1}
.c.boom{background:var(--bad);color:#fff;border-color:var(--bad)}
.c.fog{pointer-events:none;font-size:0!important;background:rgba(255,160,205,.035);border-color:rgba(255,175,218,.17);box-shadow:none}
.c.dim{opacity:.55}
button{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;
  border:2px solid var(--line);background:var(--tile);color:var(--fg);cursor:pointer}
#popupWrap{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;
  background:rgba(10,6,8,.72);z-index:50;padding:16px;box-sizing:border-box;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#popupWrap.show{display:flex}
#popupCard{position:relative;margin:auto;box-sizing:border-box;flex:none;background:var(--tile);border:2px solid var(--me);border-radius:16px;
  padding:30px 20px 22px;max-width:380px;width:100%;text-align:center;
  box-shadow:0 0 24px 4px #ff4fa355;font-weight:700;font-size:1.05rem;line-height:1.5;
  white-space:pre-line}
#popupCard.intro{max-width:460px;width:94vw;padding:34px 20px 26px;
  font-size:clamp(.74rem,4vw,.96rem);line-height:1.6;
  white-space:pre;box-shadow:0 0 32px 8px #ff4fa366}
#popupImg{display:none;width:auto;height:auto;max-width:100%;max-height:min(340px,40vh);max-height:min(340px,40dvh);object-fit:contain;
  border-radius:14px;margin-bottom:16px;box-shadow:0 4px 18px rgba(0,0,0,.45)}
#popupCard.intro{font-family:"Kaisei Decol","Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif;font-weight:700;letter-spacing:.04em;background:#fff3f8;color:#7d4426;border-color:#ff8cc4;box-shadow:0 0 32px 8px #ff4fa355}
#popupCard.intro #popupTitle{font-family:"Kaisei Decol","Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif;font-weight:800;letter-spacing:.1em}
#popupCard.intro #popupClose{background:#fff3f8;color:#7d4426;border-color:#f2b6d3}
#popupCard.intro #popupImg{display:block;margin-left:auto;margin-right:auto}
#popupTitle{font-size:1.3rem;font-weight:800;color:var(--me);margin-bottom:8px;
  font-family:"Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif}
#popupTitle:empty{display:none;margin:0}
#popupCard.note{border-style:dashed;border-color:var(--line);box-shadow:none;
  background:var(--tile);font-weight:400;font-style:italic;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:.95rem;line-height:1.8}
#popupCard.note #popupTitle{color:var(--sub);font-size:.72rem;font-weight:700;
  font-style:normal;letter-spacing:.18em;text-transform:uppercase;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  margin-bottom:12px}
#popupClose{position:absolute;top:8px;right:8px;width:30px;height:30px;
  border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--fg);
  font-size:1rem;font-weight:700;line-height:1;cursor:pointer;padding:0}
#marqueeWrap{display:block;position:relative;width:100%;height:1.7em;
  margin:6px 0;overflow:hidden;border-radius:10px;
  background:var(--tile);border:none}
.marqueeText{position:absolute;top:50%;left:100%;transform:translate(0,-50%);
  white-space:nowrap;color:rgba(255,255,255,.88);font-weight:400;font-size:.85rem;
  letter-spacing:.04em;
  font-family:"DotGothic16",monospace;
  animation:marqueeRun 6s linear forwards}
@keyframes marqueeRun{to{left:-100%}}
#reset{position:absolute;top:8px;right:12px;z-index:5;padding:4px 10px;font-size:.72rem;border-radius:8px;border-width:1px}
#reset{white-space:nowrap;color:#fff;font-weight:800;letter-spacing:.04em;
  border:1px solid #a82468;border-radius:9px;
  background:linear-gradient(180deg,#ff7ec0 0%,#ff4fa3 55%,#e02d86 100%);
  box-shadow:0 3px 0 #a82468,0 5px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.55);
  text-shadow:0 1px 1px rgba(120,10,60,.6);
  transition:transform .06s,box-shadow .06s}
#reset:active{transform:translateY(3px);box-shadow:0 0 0 #a82468,0 1px 3px rgba(0,0,0,.45),inset 0 1px 3px rgba(120,10,60,.5)}
h1{padding-right:84px}

/* スライム風：プニプニ・透け感のあるマス */
.c{position:relative;border-radius:18px;
  background:
   radial-gradient(ellipse 60% 38% at 32% 20%,rgba(255,255,255,.42),rgba(255,255,255,0) 70%),
   radial-gradient(ellipse 80% 50% at 70% 95%,rgba(255,140,200,.30),rgba(255,140,200,0) 70%),
   linear-gradient(160deg,rgba(255,130,195,.30),rgba(170,70,150,.16) 55%,rgba(255,90,170,.24));
  border:2px solid rgba(255,175,218,.42);
  box-shadow:inset 0 3px 5px rgba(255,255,255,.38),inset 0 -7px 10px rgba(130,20,90,.42),
   inset 3px 0 6px rgba(255,200,230,.12),0 4px 7px rgba(0,0,0,.45);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  transition:transform .12s cubic-bezier(.3,1.6,.5,1),background .6s ease,border-color .6s ease}
.c::after{content:"";position:absolute;left:14%;top:9%;width:30%;height:14%;border-radius:50%;
  background:rgba(255,255,255,.7);filter:blur(1px);transform:rotate(-24deg);pointer-events:none}
.c:active{transform:scale(.92,.88)}
.c.goal{box-shadow:inset 0 3px 6px rgba(255,255,255,.7),inset 0 -7px 10px rgba(0,120,150,.35),0 0 16px 3px #5be6ffcc,0 4px 7px rgba(0,0,0,.4)}
.c.boom{box-shadow:inset 0 3px 5px rgba(255,255,255,.25),inset 0 -7px 10px rgba(0,0,0,.45),0 4px 7px rgba(0,0,0,.4)}
.c.me::after{display:none}
.c.fog{backdrop-filter:none;-webkit-backdrop-filter:none}
.c.fog::after{display:none}

.sparkLayer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sparkEdge{position:absolute;inset:0;pointer-events:none}
.spark{position:absolute;display:block;margin:-6px 0 0 -6px;opacity:0;
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
  animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
#popupCard.goal{box-shadow:0 0 28px 8px #ff4fa388,0 0 60px 14px #ffd6ec44}

/* ポップアップ本文のフォントを統一（やや丸みのある読みやすい書体） */
#popupCard,#popupCard.note,#popupCard.goal{font-family:"Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
#popupCard.note #popupText,#popupCard.goal #popupText{font-style:normal;font-weight:700}
#popupCard.note{font-style:normal;font-weight:700;line-height:1.7}

#shareInfo{font-size:.9rem;font-weight:700;color:#ffd3ea;margin-bottom:10px;line-height:1.5}
#shareBtn{color:#fff;font-weight:800;letter-spacing:.04em;padding:10px 22px;border-radius:999px;
  border:1px solid #000;background:linear-gradient(180deg,#3a3a3e 0%,#0d0d0f 100%);
  box-shadow:0 3px 0 #000,0 5px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3);
  font-family:inherit;transition:transform .06s,box-shadow .06s}
#shareBtn:active{transform:translateY(3px);box-shadow:0 0 0 #000,0 1px 3px rgba(0,0,0,.45)}

/* 出口が移動したよポップアップ：出口マスと同じ水色 */
#popupCard.exit{border-color:#5be6ff;box-shadow:0 0 24px 6px #5be6ff88,0 0 50px 10px #5be6ff33;font-family:"Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif}
#popupCard.exit #popupTitle{color:#5be6ff}
#popupCard.exit #popupText{font-weight:700;font-size:.9rem;line-height:1.7}
#popupCard.exit #popupClose{border-color:#5be6ff}
/* スタートのマス（現在地が離れたら、うっすら表示） */
.c.startcell{color:rgba(255,190,225,.5);background:rgba(255,110,180,.10);border-color:rgba(255,150,200,.28);
  font-size:3.6cqw;font-weight:700;opacity:1;box-shadow:inset 0 2px 4px rgba(255,255,255,.10),0 3px 5px rgba(0,0,0,.35)}
.c.startcell::after{opacity:.35}

/* 最後の「ゲームの作り手より」：シェアを主役にし、はじめからを押すまで残す */
#shareBox{display:none;margin:2px 0 4px}
#popupCard.share #shareBox{display:block}
#popupCard.share #shareInfo{font-size:1.15rem;font-weight:900;color:#ff4fa3;margin:0 0 8px;line-height:1.4;letter-spacing:.02em}
#recordLabel{display:none;font-size:.78rem;font-weight:700;color:var(--sub);letter-spacing:.3em;margin-top:0;margin-bottom:0;line-height:1.3}
#popupCard.copied #recordLabel{display:none}
#popupCard.copied #shareInfo{white-space:pre-line}
#shareLead{font-size:.92rem;font-weight:900;color:var(--fg);opacity:.7;margin-bottom:14px;line-height:1.6}
#popupCard.share #shareBtn{font-size:1.05rem;padding:13px 30px}
#makerLabel{display:none;font-size:.74rem;font-weight:700;color:var(--sub);margin-top:18px;letter-spacing:.12em}
#popupCard.share #makerLabel{display:block}
#popupCard.share #popupText{font-size:.72rem;font-weight:500;opacity:.7;margin-top:4px;line-height:1.6}
#popupWrap.final{pointer-events:none;background:rgba(10,6,8,.68)}
#popupWrap.final #popupCard{pointer-events:auto}
.finalPopup #reset{z-index:60}

/* 〜脱出成功〜：きらめくグラデーション文字 */
#popupCard.goal #popupTitle{font-size:1.75rem;font-weight:900;letter-spacing:.1em;margin-bottom:10px;
  background:linear-gradient(90deg,#ff4fa3,#ffb347,#ff4fa3,#c85bff,#ff4fa3);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(168,26,104,.28)) drop-shadow(0 0 8px rgba(255,160,210,.7));
  animation:titleShine 3s linear infinite}
@keyframes titleShine{to{background-position:-250% 0}}
</style>
</head>

let actx=null;
function getActx(){
 if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
 if(actx.state==="suspended")actx.resume();
 return actx;
}
function beep(freq,dur,type,vol,delay){
 try{
  const ctx=getActx();
  const t0=ctx.currentTime+(delay||0);
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type=type||"sine"; osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol!=null?vol:.2,t0+.01);
  gain.gain.exponentialRampToValueAtTime(.001,t0+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur);
 }catch(e){}
}

const BGM_VOL=0.075;           // 効果音(0.14〜0.22)より十分小さく
const BPM=126, STEP_SEC=60/BPM/4;
const BGM_CHORDS=[
 {root:55.0,  notes:[220.0,261.63,329.63]},   // Am
 {root:43.65, notes:[174.61,220.0,261.63]},   // F

let bgmMode="club", bgmOn=true, bgmBus=null, bgmTimer=null, bgmNextT=0, bgmStep=0, bgmGesture=false, noiseBuf=null;
try{ if(localStorage.getItem("bgmOff")==="1")bgmOn=false; }catch(e){}
function bgmNode(ctx){
 if(!bgmBus){
  bgmBus=ctx.createGain();
  bgmBus.gain.setValueAtTime(0,ctx.currentTime);
  bgmBus.gain.linearRampToValueAtTime(bgmMode==="despair"?0.034:BGM_VOL,ctx.currentTime+(bgmMode==="calm"?1.6:bgmMode==="despair"?.02:.25));
  const comp=ctx.createDynamicsCompressor();
  bgmBus.connect(comp); comp.connect(ctx.destination);
  bgmBus._comp=comp;
 }
 return bgmBus;
}
function getNoise(ctx){
 if(!noiseBuf){
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 }
 return noiseBuf;
}
function bKick(ctx,t){
 const o=ctx.createOscillator(),g=ctx.createGain();
 o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+.12);
 g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(.001,t+.32);
 o.connect(g); g.connect(bgmNode(ctx)); o.start(t); o.stop(t+.34);
}
function bNoise(ctx,t,dur,ftype,freq,vol){
 const s=ctx.createBufferSource(); s.buffer=getNoise(ctx);
 const f=ctx.createBiquadFilter(); f.type=ftype; f.frequency.value=freq;
 const g=ctx.createGain();
 g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
 s.connect(f); f.connect(g); g.connect(bgmNode(ctx)); s.start(t,Math.random()*.5); s.stop(t+dur+.02);
}
function bTone(ctx,t,freq,dur,type,vol,cutoff){
 const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
 o.type=type; o.frequency.value=freq; f.type="lowpass"; f.frequency.value=cutoff;
 g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.008);
 g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(f); f.connect(g); g.connect(bgmNode(ctx)); o.start(t); o.stop(t+dur+.02);
}
function bgmScheduleClub(ctx,step,t){
 const s=step%16, bar=Math.floor(step/16)%4, ch=BGM_CHORDS[bar];
 if(s%4===0)bKick(ctx,t);                                  // 四つ打ち
 if(s===4||s===12)bNoise(ctx,t,.14,"bandpass",1800,.5);     // クラップ
 if(s%4===2)bNoise(ctx,t,.16,"highpass",7500,.28);          // オープンハット
 else if(s%2===1)bNoise(ctx,t,.04,"highpass",8500,.12);     // クローズハット
 if(s%4===2)bTone(ctx,t,ch.root,STEP_SEC*1.8,"sawtooth",.55,260); // オフビートベース
 if(s===3||s===6||s===11||s===14){                           // シンコペのコードスタブ
  ch.notes.forEach(n=>bTone(ctx,t,n,STEP_SEC*1.6,"sawtooth",.1,1800));
 }
 if(s%2===0){                                                // アルペジオ
  const seq=[0,1,2,1,2,1,0,1];
  bTone(ctx,t,ch.notes[seq[(s/2)%8]%3]*2,STEP_SEC*1.2,"triangle",.1,3500);
 }
}

 const s=step%8, bar=Math.floor(step/8)%4, d=DESP_BARS[bar];
 if(step===0){
  // 押した瞬間の一撃：不協和の和音を一斉に叩きつけ、低音が一気に落ちる
  [220,233.08,311.13,329.63,466.16].forEach(n=>bSaw(ctx,t,n,3.2,.5,2600,.003));
  [110,116.54].forEach(n=>bSaw(ctx,t,n,3.6,.55,900,.003));
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(30,t+1.3);
  g.gain.setValueAtTime(1.4,t); g.gain.exponentialRampToValueAtTime(.001,t+1.6);
  o.connect(g); g.connect(bgmNode(ctx)); o.start(t); o.stop(t+1.7);
  bNoise(ctx,t,.7,"lowpass",3000,.9);
  // 音が潰れるように下がっていく
  const w=ctx.createOscillator(),wf=ctx.createBiquadFilter(),wg=ctx.createGain();
  w.type="sawtooth"; wf.type="lowpass"; wf.frequency.value=1200;
  w.frequency.setValueAtTime(466,t); w.frequency.exponentialRampToValueAtTime(110,t+2.6);
  wg.gain.setValueAtTime(.35,t); wg.gain.exponentialRampToValueAtTime(.001,t+3);
  w.connect(wf); wf.connect(wg); wg.connect(bgmNode(ctx)); w.start(t); w.stop(t+3.1);
 }
 if(s===0&&step>0){
  const len=DESP_STEP*8*1.1;
  d.notes.forEach((n,k)=>{bSaw(ctx,t,n*2,len,.2,700,.4); if(k===0)bTonePad(ctx,t,n,len,.6,260);});
  bNoise(ctx,t,len*.7,"lowpass",300,.12);
 }
 if(s===0||s===3){ // 重い鼓動
  bTone(ctx,t,70,.5,"sine",s===0?1.1:.7,220);
  bNoise(ctx,t,.08,"lowpass",600,s===0?.5:.3);
 }
 const m=d.mel[s];
 if(m){
  bTone(ctx,t,m,2.6,"triangle",.34,1600);
  bTone(ctx,t,m*1.0595,2.2,"sawtooth",.09,1400);
 }
}
function bgmSchedule(ctx,step,t){
 if(bgmMode==="calm")bgmScheduleCalm(ctx,step,t); else if(bgmMode==="despair")bgmScheduleDespair(ctx,step,t); else bgmScheduleClub(ctx,step,t);
}
function bgmStepSec(){return bgmMode==="calm"?CALM_STEP:bgmMode==="despair"?DESP_STEP:STEP_SEC;}
function setBgmMode(m){
 if(bgmMode===m)return;
 bgmMode=m;
 const wasRunning=!!bgmTimer;
 stopBgm();
 if(bgmBus){                       // 前の曲はフェードアウトして切り離す（残響も残さない）
  const old=bgmBus; bgmBus=null;
  try{
   const ctx=getActx();
   old.gain.cancelScheduledValues(ctx.currentTime);
   old.gain.setTargetAtTime(0,ctx.currentTime,.25);
  }catch(e){}
  setTimeout(()=>{try{old.disconnect();if(old._comp)old._comp.disconnect();}catch(e){}},1800);
 }
 bgmStep=0;
 if(wasRunning||bgmGesture)startBgm();
}
function bgmTick(){
 try{
  const ctx=getActx();
  while(bgmNextT<ctx.currentTime+.15){
   bgmSchedule(ctx,bgmStep,bgmNextT);
   bgmNextT+=bgmStepSec(); bgmStep++;
  }
 }catch(e){}
}
function startBgm(){
 if(!bgmOn||bgmTimer)return;
 try{
  const ctx=getActx();
  bgmNextT=ctx.currentTime+.06; bgmStep=0;
  bgmTick(); bgmTimer=setInterval(bgmTick,30);
 }catch(e){}
}
function stopBgm(){ if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;} }
// ブラウザの自動再生制限のため、最初の操作でBGMを開始
function bgmFirstGesture(){
 if(bgmGesture)return; bgmGesture=true;
 ["click","touchend","keydown"].forEach(ev=>document.removeEventListener(ev,bgmFirstGesture,true));
 startBgm();
}
["click","touchend","keydown"].forEach(ev=>document.addEventListener(ev,bgmFirstGesture,true));
document.addEventListener("visibilitychange",()=>{
 if(document.hidden)stopBgm(); else if(bgmGesture)startBgm();
});


function makeMazePath(sr,sc,gr,gc,forbid){
 sr=sr==null?N-1:sr; sc=sc==null?0:sc; gr=gr==null?0:gr; gc=gc==null?N-1:gc;
 const parent={};
 const visited=new Set();
 const startKey=sr+","+sc;
 visited.add(startKey);
 const stack=[[sr,sc]];
 while(stack.length){
  const [r,c]=stack[stack.length-1];
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5);
  let moved=false;
  for(const [dr,dc] of dirs){
   const nr=r+dr, nc=c+dc, key=nr+","+nc;
   if(nr>=0&&nr<N&&nc>=0&&nc<N&&!visited.has(key)&&!(forbid&&forbid===key)){
    visited.add(key); parent[key]=r+","+c; stack.push([nr,nc]); moved=true; break;
   }
  }
  if(!moved)stack.pop();
 }
 // スタート→ゴール順の経路配列と、マス集合の両方を返す
 const ordered=[]; let cur=gr+","+gc;
 while(true){
  ordered.push(cur);
  if(cur===startKey)break;
  cur=parent[cur];
 }
 ordered.reverse();
 return ordered;
}
function maxStraightRun(ordered){
 // 経路の中で同じ向きに何マス連続で進むかの最大値（大きいほど一直線に見える）
 let max=1, run=1;
 for(let i=1;i<ordered.length-1;i++){
  const [pr,pc]=ordered[i-1].split(",").map(Number);
  const [r,c]=ordered[i].split(",").map(Number);
  const [nr,nc]=ordered[i+1].split(",").map(Number);
  const d1=(r-pr)+","+(c-pc), d2=(nr-r)+","+(nc-c);
  run = d1===d2 ? run+1 : 1;
  if(run>max)max=run;
 }
 return max;
}

function straightCount(ordered){
 // 「前の向きと同じ向きにそのまま進む」マスの数（少ないほどジグザグ）
 let n=0;
 for(let i=1;i<ordered.length-1;i++){
  const [pr,pc]=ordered[i-1].split(",").map(Number);
  const [r,c]=ordered[i].split(",").map(Number);
  const [nr,nc]=ordered[i+1].split(",").map(Number);
  if((r-pr)===(nr-r)&&(c-pc)===(nc-c))n++;
 }
 return n;
}
function pathScore(ordered){
 // 小さいほど良い：直進が少なく、遠回り（経路が長い）ほど高評価
 return maxStraightRun(ordered)*6+straightCount(ordered)*4-ordered.length;
}
function build(){
 const L=levels[lv];
 // 迷路ルートを何本か作り、「一直線に3マス以上進む区間」が最も少ない
 // (=ジグザグ度が高い) ものを採用する。花マスの多さは二の次にする。
 let bestOrdered=null, bestScore=Infinity;
 for(let t=0;t<600;t++){
  const ordered=makeMazePath();
  const sc=pathScore(ordered);
  if(sc<bestScore){bestScore=sc;bestOrdered=ordered;}
 }
 const safe=new Set(bestOrdered);
 cells=[];
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const s=safe.has(i+","+j);
  cells.push({v:s?L.ok():L.ng(),safe:s});
 }
 // （以前はここで「こうがん」を水増ししていたが、難易度を上げるため廃止。正解は経路のマスだけ）
 // ゴールマスは必ず安全でGOAL表示
 goalR=0; goalC=N-1; exitMoved=false; nextMoveAt=5;
 const gi=goalR, gj=goalC;
 cells[gi*N+gj].safe=true;
 cells[gi*N+gj].v="出口";
 // 落とし穴：1列に1つの割合で、既に不安全なマスの中からランダムに配置
 for(let j=0;j<N;j++){
  const candidates=[];
  for(let i=0;i<N;i++){
   if(i===goalR&&j===goalC)continue; // ゴールマスは除外
   if(!cells[i*N+j].safe)candidates.push(i*N+j);
  }
  if(candidates.length){
   const idx=candidates[Math.floor(Math.random()*candidates.length)];
   cells[idx].v=PITFALL;
  }
 }
 pos={r:N-1,c:0};
 kouganCount=0;
 document.getElementById("rule").innerHTML=L.r;
 draw();
 showPopup(L.t,null,"こうがん踏み脱出ゲーム","intro");
}
let popupOnClose=null;
function showPopup(text,onClose,title,variant){
 const wrap=document.getElementById("popupWrap");
 const card=document.getElementById("popupCard");
 document.getElementById("popupTitle").textContent=title||"";
 document.getElementById("popupImg").src=variant==="intro"?INTRO_IMG:"";
 document.getElementById("popupText").textContent=text;
 card.classList.toggle("note",variant==="note");
 card.classList.toggle("intro",variant==="intro");
 card.classList.toggle("goal",variant==="final");
 card.classList.toggle("exit",variant==="exit");
 card.classList.remove("copied");
 card.classList.toggle("share",variant==="final");
 wrap.classList.toggle("final",variant==="final");
 document.documentElement.classList.toggle("finalPopup",variant==="final");
 if(variant==="final")document.getElementById("shareInfo").textContent="記録："+fmtTime(clearSec)+"（ミス"+missCount+"回）";
 clearSparkles();
 popupOnClose=onClose||null;
 wrap.classList.add("show");
 if(variant==="final")spawnSparkles();
}

// ゴール時のキラキラ演出（文字と重ならない位置：カードの外側と縁だけ）
const SPARK_COLORS=["#fff","#ffd6ec","#ffe9a8","#bff3ff","#ff9ccf"];
function clearSparkles(){
 document.querySelectorAll(".sparkLayer,.sparkEdge").forEach(e=>e.remove());
}
function mkSpark(x,y,size,delay,dur){
 const e=document.createElement("i");e.className="spark";
 e.style.left=x+"px";e.style.top=y+"px";e.style.width=e.style.height=size+"px";
 e.style.background=SPARK_COLORS[Math.floor(Math.random()*SPARK_COLORS.length)];
 e.style.animationDelay=delay+"s";e.style.animationDuration=dur+"s";
 return e;
}
function spawnSparkles(){
 const wrap=document.getElementById("popupWrap"),card=document.getElementById("popupCard");
 const cr=card.getBoundingClientRect(),W=window.innerWidth,H=window.innerHeight;
 const layer=document.createElement("div");layer.className="sparkLayer";
 let n=0,tries=0;
 while(n<34&&tries<400){
  tries++;
  const x=Math.random()*W,y=Math.random()*H;
  if(x>cr.left-26&&x<cr.right+26&&y>cr.top-26&&y<cr.bottom+26)continue;
  layer.appendChild(mkSpark(x,y,8+Math.random()*16,Math.random()*2.4,1.4+Math.random()*1.4));n++;
 }
 wrap.insertBefore(layer,wrap.firstChild);
 const edge=document.createElement("div");edge.className="sparkEdge";
 const pts=[[0,.12],[0,.5],[0,.88],[1,.2],[1,.55],[1,.9],[.15,0],[.5,0],[.85,0],[.2,1],[.55,1],[.85,1]];
 pts.forEach(p=>{
  const e=mkSpark(0,0,10+Math.random()*10,Math.random()*2,1.4+Math.random());
  e.style.left=(p[0]*100)+"%";e.style.top=(p[1]*100)+"%";edge.appendChild(e);
 });
 // 枠線にはキラキラを載せない
}

function fmtTime(sec){return sec>=60?Math.floor(sec/60)+"分"+(sec%60)+"秒":sec+"秒";}
function setShareMsg(m){
 document.getElementById("shareInfo").textContent=m;
 document.getElementById("popupCard").classList.add("copied");
}
function shareResult(){
 const text="【こうがん踏み脱出ゲーム】\n\n✨脱出成功✨\n記録："+fmtTime(clearSec)+"（ミス"+missCount+"回）\n\n#こうがん踏み脱出ゲーム\n"+SHARE_URL;
 const intent="https://twitter.com/intent/tweet?text="+encodeURIComponent(text);
 let w=null;
 try{w=window.open(intent,"_blank");}catch(e){}
 if(w)return;
 const info=document.getElementById("shareInfo");
 const fallbackCopy=()=>{
  try{navigator.clipboard.writeText(text).then(()=>{setShareMsg("結果をコピーしました！\nXに貼り付けてね");},()=>{setShareMsg("シェアできませんでした…");});}
  catch(e){setShareMsg("シェアできませんでした…");}
 };
 try{
  if(navigator.share){navigator.share({text:text}).catch(fallbackCopy);return;}
 }catch(e){}
 fallbackCopy();
}
document.getElementById("shareBtn").onclick=shareResult;
function closePopup(){
 clearSparkles();
 document.getElementById("popupWrap").classList.remove("show","final");
 document.documentElement.classList.remove("finalPopup","celebrate");
 const cb=popupOnClose; popupOnClose=null;
 if(cb)cb();
}
document.getElementById("popupClose").onclick=closePopup;
function showMarquee(text){
 const wrap=document.getElementById("marqueeWrap");
 wrap.innerHTML="";
 const span=document.createElement("span");
 span.className="marqueeText";
 span.textContent=text;
 span.addEventListener("animationend",()=>{
  wrap.classList.remove("show");
  wrap.innerHTML="";
 });
 wrap.appendChild(span);
 wrap.classList.add("show");
}
function draw(boom){
 const g=document.getElementById("grid"); g.innerHTML="";
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const d=document.createElement("div"), k=i*N+j;
  const isGoal=(i===goalR&&j===goalC);
  const dist=Math.abs(pos.r-i)+Math.abs(pos.c-j);
  d.className="c"; d.textContent=cells[k].v;
  if(cells[k].v==="こうがん"||DECOYS.includes(cells[k].v))d.classList.add("kougan");
  else if(!isGoal&&cells[k].v.length>2)d.classList.add("small");
  if(isGoal)d.classList.add("goal");
  const isStart=(i===N-1&&j===0), onStart=(pos.r===N-1&&pos.c===0);
  if(boom&&boom.r===i&&boom.c===j){d.classList.add("boom");d.textContent="×"}
  else if(pos.r===i&&pos.c===j){d.classList.add("me");d.innerHTML='<span class="footemoji">🦶🏻</span>'}
  else if(dist===1)d.classList.add("near");
  // 視界制限：ゴールは常に見える。自分から遠いマスは薄く/隠す
  if(!isGoal&&!(pos.r===i&&pos.c===j)){
   if(dist>VIEW_RADIUS+1)d.classList.add("fog");
   else if(dist>VIEW_RADIUS)d.classList.add("dim");
  }
  if(isStart&&!onStart&&!isGoal&&!(boom&&boom.r===i&&boom.c===j)){d.classList.remove("fog","dim","kougan","small");d.classList.add("startcell");d.textContent="スタート";}
  d.onclick=()=>move(i,j);
  g.appendChild(d);
 }
}
// こうがんを5回踏むと出口が別の場所へ移動する（新しい道もちゃんとできる）
function moveExit(){
 const oldR=goalR, oldC=goalC, oldKey=oldR+","+oldC;
 const cand=[];
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  if(i===oldR&&j===oldC)continue;
  if(i===N-1&&j===0)continue; // スタート地点は出口にしない
  if(Math.abs(pos.r-i)+Math.abs(pos.c-j)>=3)cand.push([i,j]);
 }
 if(!cand.length)return false;
 const [nr,nc]=cand[Math.floor(Math.random()*cand.length)];
 let best=null,bs=Infinity;
 for(let t=0;t<200;t++){
  const o=makeMazePath(pos.r,pos.c,nr,nc,oldKey);
  const sc=pathScore(o);
  if(sc<bs){bs=sc;best=o;}
 }
 const L=levels[lv];
 // 旧出口はニセ物（踏むとミス）に
 cells[oldR*N+oldC]={v:L.ng(),safe:false};
 for(const key of best){
  const [r,c]=key.split(",").map(Number), cell=cells[r*N+c];
  if(!cell.safe){cell.safe=true;cell.v=L.ok();}
 }
 goalR=nr; goalC=nc;
 cells[nr*N+nc]={v:"出口",safe:true};
 exitMoved=true;
 nextMoveAt=kouganCount+6;
 return true;
}
function move(i,j){
 if(finished)return;
 if(Math.abs(pos.r-i)+Math.abs(pos.c-j)!==1)return;
 if(!t0)t0=Date.now();
 if(!cells[i*N+j].safe){
  const missedVal=cells[i*N+j].v;
  draw({r:i,c:j});
  missCount++;
  sndMiss(); vib([260,70,120]);
  let text,title;
  if(missedVal===DECOY_KOUKAN){title="スタートに戻る";text="おしい！これは「こうかん」だよ\n左の玉と右の玉交換しちゃう？";}
  else if(missedVal===DECOY_GANKOU){title="スタートに戻る";text="あれれ、これは「がんこう」だよ\n鋭い眼光( •̀∀•́ )✧";}
  else if(missedVal===DECOY_KOUSAN){title="スタートに戻る";text="え、こうさん？！\n白旗上げないで士気上げていこうね";}
  else if(missedVal===DECOY_KONKAN){title="スタートに戻る";text="ざんねん！これは「こんかん」だよ\nチリコンカン🤠🎶";}
  else if(missedVal===PITFALL){title="スタートに戻る";text="ざんねん！ここは落とし穴！\n恋に落ちちゃったのかしら(´･_･`)";}
  else{title="スタートに戻る";text="こら！お花踏んじゃだめでしょ😡\nスタートからやり直しなさい";}
  setBgmMode("despair");
  showPopup(text,()=>{setBgmMode("club");pos={r:N-1,c:0};kouganCount=0;draw();},title);
  return;
 }
 if(cells[i*N+j].v==="こうがん"){
  kouganCount++;
  const msg=kouganCount<=KOUGAN_MSGS.length?KOUGAN_MSGS[kouganCount-1]:KOUGAN_MSG_LAST;
  showMarquee(msg);
 }
 pos={r:i,c:j};
 let exitJustMoved=false;
 if(kouganCount>=nextMoveAt&&!(i===goalR&&j===goalC))exitJustMoved=moveExit();
 draw();
 if(exitJustMoved){sndStep();vib(12);showPopup("大変だ…！計画を立て直そう\n慎重にね",null,"出口が移動した！","exit");return;}
 if(i===goalR&&j===goalC){
  sndGoal();
  if(lv<levels.length-1)showPopup("出口に到着！ つぎのレベルへ →",()=>{lv++;build();});
  else{
   finished=true; clearSec=Math.max(1,Math.round((Date.now()-t0)/1000));
   document.documentElement.classList.add("celebrate");
   setBgmMode("calm");
   showPopup("遊んでくれてありがとう！\n右上の「はじめから」を押すと\nもう一度遊べるよ🐱",null,"〜脱出成功〜","final");
  }
 }else{sndStep();vib(12);}
}
document.getElementById("reset").onclick=()=>{sndChime();finished=false;missCount=0;t0=0;document.documentElement.classList.remove("celebrate");setBgmMode("club");lv=0;build()};
build();
</script>
